# 小筑 · GitHub OAuth 代理（Cloudflare Worker）
# 部署：npx wrangler deploy --config oauth-worker/wrangler.toml
#
# 部署前先在 Cloudflare 控制台配好环境变量（或改用 wrangler secret put）：
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / ALLOWED_DOMAINS

name = "xiaozhu-oauth"
main = "index.js"
compatibility_date = "2024-11-01"

# 访问地址将是：https://xiaozhu-oauth.<你的CF子域>.workers.dev
# 再通过自定义路由挂到 blog.heiyunas.top/api/auth（见后台配置指引.md 第 4 步）

[vars]
ALLOWED_DOMAINS = "blog.heiyunas.top,localhost:8899,127.0.0.1:8899"

# ⚠️ GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET 不要写在这里（会进仓库）。
#    用命令写入加密变量：
#      npx wrangler secret put GITHUB_CLIENT_ID --config oauth-worker/wrangler.toml
#      npx wrangler secret put GITHUB_CLIENT_SECRET --config oauth-worker/wrangler.toml
