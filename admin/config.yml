# ============================================================
#  小筑 · 内容管理后台配置（Decap CMS）
# ------------------------------------------------------------
#  ★ 后台地址：https://blog.heiyunas.top/admin
#  ★ 数据真身：data/games.json / reading.json / films.json
#  ★ 在这里改内容 → 自动提交到 GitHub → Cloudflare 自动重新构建
# ============================================================

backend:
  name: github
  repo: HYxueyu/myblog
  branch: main
  # 登录后跳转与回调由 Cloudflare Pages 的 /api/auth 处理
  base_url: https://blog.heiyunas.top
  auth_endpoint: api/auth
  # ★ 必须与 base_url 的主机名一致。
  #   Decap 用 site_domain 作为 site_id 传给 /api/auth；
  #   不配的话会传成 site_id=undefined，虽然不影响握手，
  #   但会让 state 参数失真，且本地 localhost 调试时也会走错分支。
  site_domain: blog.heiyunas.top

# ------------------------------------------------------------
#  媒体库（Media）
#  ★ 上传的图统一存到 uploads/，绝不与 posters/ 混在一起
#    posters/ 里全是脚本刮削来的封面（steam-* / bgm-* / db-*），
#    若 media_folder 指向 posters/，媒体库会把 70 张刮削图全列出来，
#    而且上传的图会和它们混在一起，根本分不清。
#
#  ★ 想要「分相册」怎么办（Decap 原生限制，实测确认）
#    Decap 的媒体库**不支持在界面里选目录、也不支持新建相册**：
#      - media_library: 只能挂外部媒体库（uploadcare 之类），
#        填别的名字会报 "Missing external media library"
#      - media_folder 只能全局一个，字段级只在 markdown 编辑器里生效
#    → 折中办法：文件名带前缀，用搜索框过滤。
#      「搜索」框输入前缀即可筛出想要的那组图，例如：
#        gallery_   相册页生活照
#        cover_     条目封面
#        blog_      文章配图
#      上传后手动把文件名改成对应前缀（或上传前就改好）。
#
#  ★ 手动指定已有图片（刮削图）当封面：不用走媒体库。
#    点封面字段右侧的「手动输入」/ 直接粘贴路径
#      /posters/steam-1593500.jpg
#    ★ 路径必须以 / 开头（站点根目录绝对路径）。
#      这样 Decap 会原样使用，不会被 public_folder 重算，
#      线上、子页面（/post.html）下都能正确加载。
#
#  ★ 条目列表看不到封面缩略图？
#    Decap 的条目列表有两种视图，右上角可切换：
#      - 列表视图（≡）：只显示文字标题
#      - 网格视图（⊞ 九宫格）：显示封面缩略图  ← 想看封面请切这个
#    「cover」字段名正好命中 Decap 的封面识别白名单
#    （image / cover / poster / thumbnail ...），切到网格视图即会显示。
# ------------------------------------------------------------
media_folder: "uploads"
public_folder: "/uploads"

# 界面语言
locale: zh_Hans

# 关闭"编辑工作流"（保存即提交，不搞草稿审核那套，简单直接）
publish_mode: simple

# 关闭每条内容的预览面板（我们的卡片样式复杂，预览意义不大）
editor:
  preview: false

# ★ 上传文件的命名规则：中文保留，空格换下划线，避免 URL 乱码
slug:
  encoding: "unicode"
  clean_accents: false
  sanitize_replacement: "_"

collections:
  # ======================== 游戏墙 ========================
  # 提示：Decap 的「文件集合」是两层结构 —— 这里只显示文件卡片，
  #       点进「游戏列表」那张卡片才会看到 47 个游戏条目。
  - name: "games"
    label: "游戏墙"
    label_singular: "游戏"
    description: "点开下面这张卡片 → 编辑游戏条目"
    files:
      - name: "games_data"
        label: "游戏列表"
        description: "点这里 → 查看 / 修改 47 个游戏"
        file: "data/games.json"
        format: json
        fields:
          - label: "数据类型标识（勿改）"
            name: "kind"
            widget: "hidden"
            default: "game"
          - label: "游戏条目"
            name: "items"
            label_singular: "游戏"
            widget: "list"
            summary: "{{fields.title}} · {{fields.platform}} · {{fields.status}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "类型", name: "type", widget: "hidden", default: "游戏" }
              - label: "分类"
                name: "genre"
                widget: "select"
                options:
                  - "角色扮演"
                  - "动作冒险"
                  - "射击"
                  - "策略经营"
                  - "工具"
                  - "独立游戏"
                  - "恐怖"
                  - "体育竞技"
                required: false
              - label: "平台"
                name: "platform"
                widget: "select"
                options: ["Steam", "PS5", "PS4", "Switch", "Xbox", "Epic", "手游", "PS4 / PS5", "其他"]
                required: false
              - label: "状态"
                name: "status"
                widget: "select"
                options:
                  - { label: "在玩", value: "playing" }
                  - { label: "已通关", value: "done" }
                  - { label: "想玩", value: "wish" }
                default: "playing"
              - { label: "进度 / 时长", name: "progress", widget: "string", required: false, hint: "如「18.3 小时 · 最近 2026-04」或「刚玩了几个任务」" }
              - { label: "评分（0-5，支持 0.5）", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, default: 0, required: false }
              - { label: "开发商 / 工作室", name: "author", widget: "string", required: false }
              - { label: "短评", name: "comment", widget: "text", required: false, hint: "一句话感想，会显示在详情弹窗里" }
              - { label: "长篇观后感", name: "review", widget: "markdown", required: false, hint: "留空则详情弹窗里不出现「阅读全文」按钮" }
              - { label: "封面图", name: "cover", widget: "image", required: false, hint: "竖版海报最佳。自己上传的图会存到 uploads/；想复用刮削图，点「手动输入」粘 /posters/xxx.jpg 这类绝对路径" }
              - { label: "占位图标", name: "emoji", widget: "string", default: "🎮", required: false }

  # ======================== 阅读墙 ========================
  - name: "reading"
    label: "阅读墙"
    label_singular: "书 / 漫画"
    description: "点开下面这张卡片 → 编辑书目条目"
    files:
      - name: "reading_data"
        label: "书目列表"
        description: "点这里 → 查看 / 修改书目"
        file: "data/reading.json"
        format: json
        fields:
          - label: "数据类型标识（勿改）"
            name: "kind"
            widget: "hidden"
            default: "reading"
          - label: "书目条目"
            name: "items"
            label_singular: "书 / 漫画"
            widget: "list"
            summary: "{{fields.title}} · {{fields.type}} · {{fields.status}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - label: "类型"
                name: "type"
                widget: "select"
                options: ["书", "漫画"]
                default: "书"
              - { label: "作者", name: "author", widget: "string", required: false }
              - label: "状态"
                name: "status"
                widget: "select"
                options:
                  - { label: "在读", value: "reading" }
                  - { label: "已读完", value: "done" }
                  - { label: "想读", value: "wish" }
                default: "reading"
              - { label: "进度（百分比数字，如 42）", name: "progress", widget: "number", value_type: "int", min: 0, max: 100, default: 0, required: false }
              - { label: "评分（0-5，支持 0.5）", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, default: 0, required: false }
              - { label: "短评", name: "comment", widget: "text", required: false }
              - { label: "长篇书评", name: "review", widget: "markdown", required: false }
              - { label: "封面图", name: "cover", widget: "image", required: false }
              - { label: "占位图标", name: "emoji", widget: "string", default: "📚", required: false }

  # ======================== 影视墙 ========================
  - name: "films"
    label: "影视墙"
    label_singular: "电影 / 剧集"
    description: "点开下面这张卡片 → 编辑影视条目"
    files:
      - name: "films_data"
        label: "影视列表"
        description: "点这里 → 查看 / 修改影视"
        file: "data/films.json"
        format: json
        fields:
          - label: "数据类型标识（勿改）"
            name: "kind"
            widget: "hidden"
            default: "film"
          - label: "影视条目"
            name: "items"
            label_singular: "电影 / 剧集"
            widget: "list"
            summary: "{{fields.title}} · {{fields.type}} · {{fields.status}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - label: "类型"
                name: "type"
                widget: "select"
                options: ["电影", "剧集"]
                default: "电影"
              - { label: "导演", name: "author", widget: "string", required: false }
              - label: "状态"
                name: "status"
                widget: "select"
                options:
                  - { label: "在看", value: "watching" }
                  - { label: "已看完", value: "done" }
                  - { label: "想看", value: "wish" }
                default: "wish"
              - { label: "进度", name: "progress", widget: "string", required: false, hint: "如「S2E05」「看到 45 分钟」" }
              - { label: "评分（0-5，支持 0.5）", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, default: 0, required: false }
              - { label: "短评", name: "comment", widget: "text", required: false }
              - { label: "长篇观后感", name: "review", widget: "markdown", required: false }
              - { label: "封面图", name: "cover", widget: "image", required: false }
              - { label: "占位图标", name: "emoji", widget: "string", default: "🎬", required: false }
