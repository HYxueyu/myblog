# Butterfly 主题配置

# 导航栏
nav:
  menu_title: 我的小天地
  logo: 
  menu:
    首页: / || fas fa-home
    日志: /archives/ || fas fa-archive
    分类: /categories/ || fas fa-folder
    标签: /tags/ || fas fa-tags
    音乐: /music/ || fas fa-music
    关于: /about/ || fas fa-user

# 主题色
theme_color:
  enable: true
  main: "#0066cc"
  paginator: "#0066cc"
  button_hover: "#0055aa"
  text_selection: "#0066cc"
  dark_mode: "#1e1e1e"

# 网站favicon
favicon: /favicon.ico

# 头图
avatar: /img/avatar.jpg

# 首页文章封面
index_img:
  enable: true
  default_cover:
    - /img/cover-hello.jpg
    - /img/cover-mountain.jpg
    - /img/cover-diy.jpg
    - /img/cover-zelda.jpg
    - /img/cover-vlog.jpg

# 顶部图
top_img:
  enable: true
  default: /img/cover-mountain.jpg
  show: fixed

# 文章页
post:
  meta:
    date:
      enable: true
    categories:
      enable: true
    tags:
      enable: true
  cover:
    enable: true
  toc:
    enable: true
    number: true
    auto_open: true
  copyright:
    enable: false

# 搜索
search:
  enable: true
  path: /search/index.xml
  field: post
  content: true

# 评论区 - Giscus
comments:
  enable: true
  use: giscus
  giscus:
    repo: your-username/your-repo
    repo_id: your-repo-id
    category: General
    category_id: your-category-id
    mapping: pathname
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    theme: light
    lang: zh-CN

# 音乐播放器
aplayer:
  enable: true
  cdn: https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js
  css: https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css
  meting: true
  meting_cdn: https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js

# 社交链接
social:
  GitHub: fas fa-github || https://github.com || #aaa
  Email: fas fa-envelope || mailto:hello@example.com || #aaa

# 页脚
footer:
  copyright: 我的小天地
  since: 2024
  enable: true

# 暗黑模式
darkmode:
  enable: true
  button: true
  autoChangeMode: auto

# 文章分类
categories:
  - { name: 生活日志, icon: fas fa-pen }
  - { name: 相册, icon: fas fa-camera }
  - { name: Vlog, icon: fas fa-video }
  - { name: 音乐, icon: fas fa-music }
  - { name: 回忆, icon: fas fa-heart }
  - { name: DIY, icon: fas fa-tools }
  - { name: 游戏攻略, icon: fas fa-gamepad }
