# FlatPaper 主题配置

# 导航菜单
menu:
  首页:
    link: /
    icon: home
  文章:
    icon: folder
    item:
      归档:
        link: /archives/
        icon: archive
      分类:
        link: /categories/
        icon: folder
      标签:
        link: /tags/
        icon: tag
  相册:
    link: /gallery/
    icon: image
  音乐:
    link: /music/
    icon: music
  关于:
    link: /about/
    icon: user

# 站点图标
favicon: /img/butterfly-icon.png

# 背景特效
background:
  style: default

# 全局样式
color: blue
tape:
  enable: true
tags:
  style: tape
links:
  style: tape
buttons:
  style: circle

# 页脚
footer:
  left: '&copy; {year} By {name}'
  powered:
    enable: true
    prefix: Powered by
    name: FlatPaper
    link: https://github.com/Homulilly/hexo-theme-flatpaper

# 个人资料
profile:
  role: 日常记录
  bio: 记录生活，分享美好时光。生活不是每天都精彩，但总有值得收藏的片段。
  avatar: /img/avatar.jpg
  avatar_shape: circle
  site_info:
    posts: /archives/
    categories: /categories/
    tags: /tags/
  social:
    GitHub: https://github.com/HYxueyu
    Email: mailto:1163283950@qq.com

# 欢迎卡片
welcome:
  label: 今日份记录
  title: 把日子，慢慢写下来
  text: 生活不是每天都精彩，但总有值得收藏的片段。
  cta_text: 开始阅读
  cta_link: /archives/

# 首页开屏大图
home_hero:
  enable: true
  title: 我的小天地
  subtitle: 记录生活点滴
  bio: 记录生活，分享美好时光。照片、Vlog、音乐、DIY、游戏攻略，都在这里。
  avatar: /img/avatar.jpg
  avatar_shape: circle
  mobile_image: true
  cta_text: 开始阅读
  cta_link: "#flatpaper-home-content"
  stickers:
    enable: true
    draggable: true

# 列表与排版
excerpt_length: 96
random_posts: 5
related_posts: 4

# 首页置顶轮播
featured_autoplay: 5000
featured_image_zigzag: true

# 文章顶部图片
post_top_img:
  mode: fallback

# 文章样式
article:
  strong_accent: true

# 提示块与代码
note:
  style: sticky
  icons: true
code:
  theme: simple

# 评论系统 - 使用自定义评论
comments:

# 搜索
search:
  limit: 0

# 图片灯箱
fancybox:
  enable: true

# RSS
rss:
  enable: true
  path: /atom.xml

# 自定义注入 - 评论系统和音乐播放器
inject:
  bottom:
    - <script src="/js/comment.js"></script>
